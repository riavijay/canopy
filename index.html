<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Canopy</title>
    <meta name="description" content="Lie back and look up. The trees overhead follow the season wherever you are." />
    <meta name="theme-color" content="#9fd2ea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1d3526;
        --ink-soft: rgba(29, 53, 38, 0.62);
        --glass: rgba(255, 255, 250, 0.62);
        --glass-strong: rgba(255, 255, 250, 0.86);
        --line: rgba(29, 53, 38, 0.12);
        --accent: #2f6a3c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd2ea; }
      body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }
      button { font: inherit; color: inherit; }

      .chip {
        position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px;
        display: flex; align-items: center; gap: 10px;
        padding: 9px 16px 9px 12px; border: 0; border-radius: 999px;
        background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 24px rgba(20, 50, 30, 0.12);
        cursor: pointer; text-align: left; max-width: calc(100vw - 32px);
        transition: background .2s ease;
      }
      .chip:hover { background: var(--glass-strong); }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 4px rgba(47,106,60,.14); }
      .chip .where { font-size: 14px; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip .season { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: 16px; }
      .chip .sub { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-top: 1px; }
      .chip .caret { opacity: .5; font-size: 11px; margin-left: 2px; transition: transform .2s ease; }
      .chip[aria-expanded="true"] .caret { transform: rotate(180deg); }

      .panel {
        position: fixed; top: calc(max(16px, env(safe-area-inset-top)) + 64px); left: 16px;
        width: min(340px, calc(100vw - 32px)); padding: 16px;
        border-radius: 20px; background: var(--glass-strong);
        backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
        box-shadow: 0 12px 40px rgba(20, 50, 30, 0.18);
        opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top left; pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
      }
      .panel.open { opacity: 1; transform: none; pointer-events: auto; }
      .panel h2 { margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: 16px; color: var(--ink); }
      .panel h2 + .row, .head + .row { margin-bottom: 16px; }
      .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .head h2 { margin: 0; }
      .units { display: inline-flex; padding: 2px; border-radius: 999px; background: rgba(29,53,38,.08); }
      .units button { border: 0; background: transparent; border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--ink-soft); }
      .units button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,50,30,.15); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .pill {
        border: 1px solid var(--line); background: rgba(255,255,255,.5); border-radius: 999px;
        padding: 6px 11px; font-size: 13px; cursor: pointer; transition: background .15s ease, border-color .15s ease;
      }
      .pill:hover { background: #fff; }
      .pill[aria-pressed="true"] { background: var(--ink); color: #f7f6ea; border-color: var(--ink); }
      .pill.home { font-weight: 500; }
      .note { margin: 12px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-soft); }
      .gap { margin-top: 18px !important; }
      .wx { border-radius: 14px; background: rgba(255,255,255,.55); border: 1px solid var(--line); padding: 12px 14px; }
      .wx-main { display: flex; align-items: center; gap: 12px; }
      .wx-temp { font-family: 'Fraunces', Georgia, serif; font-size: 36px; line-height: 1; letter-spacing: -0.02em; }
      .wx-cond { display: block; font-size: 15px; font-weight: 500; text-transform: capitalize; }
      .wx-sub { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
      .wx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin: 12px 0 0; }
      .wx-grid div { min-width: 0; }
      .wx-grid dt { font-size: 11px; color: var(--ink-soft); }
      .wx-grid dd { margin: 1px 0 0; font-size: 13px; font-weight: 500; white-space: nowrap; }
      .wx-src { margin: 10px 0 0; font-size: 11px; line-height: 1.45; color: var(--ink-soft); }
      .wx-src a { color: var(--accent); }
      .slider { display: block; margin: 4px 0 14px; }
      .slider-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
      .tag { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: 15px; color: var(--ink); }
      .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-soft); margin-top: 4px; padding: 0 3px; }
      input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px; margin: 0;
        background: rgba(29,53,38,.12); outline: none; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff;
        border: 0; box-shadow: 0 1px 4px rgba(10,30,20,.35), 0 0 0 3px rgba(255,255,255,.5);
      }
      input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(10,30,20,.35); }
      input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
      .link { border: 0; background: none; padding: 2px 0; font-size: 13px; color: var(--accent); cursor: pointer; font-weight: 500; }
      .link:hover { text-decoration: underline; }
      .search { position: relative; }
      .search input {
        width: 100%; font: inherit; font-size: 14px; color: var(--ink); padding: 10px 14px; border-radius: 12px;
        border: 1px solid var(--line); background: rgba(255,255,255,.7); outline: none;
      }
      .search input:focus { border-color: var(--accent); background: #fff; }
      #results { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
      #results button {
        width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px;
        font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
      }
      #results button:hover, #results button:focus-visible { background: rgba(29,53,38,.07); outline: none; }
      #results small { color: var(--ink-soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #results .empty { font-size: 13px; color: var(--ink-soft); padding: 6px 10px; }
      .panel { max-height: calc(100vh - 110px); overflow-y: auto; }

      .sound {
        position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
        width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center;
        background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 6px 24px rgba(20, 50, 30, 0.12); cursor: pointer;
      }
      .sound:hover { background: var(--glass-strong); }
      .sound svg { width: 20px; height: 20px; }
      .sound .waves { transition: opacity .2s ease; }
      .sound[aria-pressed="false"] .waves { opacity: 0; }
      .sound[aria-pressed="true"] .slash { opacity: 0; }

      .hint {
        position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap;
        background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: opacity 1.2s ease; pointer-events: none;
      }
      .hint.gone { opacity: 0; }
      @media (max-width: 520px) { .hint { bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px)); } }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Looking up at trees against the sky"></canvas>

    <button class="chip" id="chip" aria-expanded="false" aria-controls="panel">
      <span class="dot" aria-hidden="true"></span>
      <span class="where"><span id="city">Looking up…</span> <span class="season" id="season"></span>
        <span class="sub" id="sub">&nbsp;</span></span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>

    <div class="panel" id="panel" role="dialog" aria-label="Time, season and place">
      <div class="head">
        <h2 id="wxTitle">Right now</h2>
        <div class="units" id="units" role="group" aria-label="Temperature units">
          <button data-u="C" aria-pressed="false">°C</button><button data-u="F" aria-pressed="false">°F</button>
        </div>
      </div>
      <section class="wx" id="wx" aria-live="polite">
        <div class="wx-main">
          <span class="wx-temp" id="wxTemp">–</span>
          <span><span class="wx-cond" id="wxCond">Checking the sky…</span><span class="wx-sub" id="wxSub"></span></span>
        </div>
        <dl class="wx-grid" id="wxGrid"></dl>
        <p class="wx-src" id="wxSrc"></p>
      </section>
      <h2 class="gap">Wander through the year</h2>
      <label class="slider">
        <span class="slider-top"><span id="monthLabel">—</span><span class="tag" id="monthSeason"></span></span>
        <input type="range" id="month" min="0" max="364" step="1" aria-label="Day of the year" />
        <span class="ticks" aria-hidden="true"><span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span><span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span></span>
      </label>
      <label class="slider">
        <span class="slider-top"><span>Time of day</span><span class="tag" id="hourLabel"></span></span>
        <input type="range" id="hour" min="0" max="95" step="1" aria-label="Time of day" />
        <span class="ticks" aria-hidden="true"><span>12a</span><span>6a</span><span>noon</span><span>6p</span><span>12a</span></span>
      </label>
      <button class="link" id="now" hidden>↺ Back to right now</button>

      <h2 class="gap">Wanna peek at someone else’s sky?</h2>
      <div class="search">
        <input id="q" type="search" placeholder="Try Kyoto, Lisbon, Pune…" autocomplete="off" spellcheck="false" aria-label="Search for a city" />
        <ul id="results" role="listbox"></ul>
      </div>
      <button class="link" id="mysky" hidden>☀︎ Back to my sky</button>
      <p class="note" id="note"></p>
    </div>

    <button class="sound" id="sound" aria-pressed="false" aria-label="Sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none" />
        <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18 6.5a7.5 7.5 0 0 1 0 11" /></g>
        <g class="slash"><path d="M16 9.5l5 5M21 9.5l-5 5" /></g>
      </svg>
    </button>

    <div class="hint" id="hint">Move to stir the leaves · tap for sound</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
